windowrule {
    name = suppress
    match:class = .*

    suppress_event = maximize
}

# game engine stuff 
windowrule {
	name = float-dev
	match:title = ^(opengl game|python)$
	float = true
}

windowrule {
	name = info-small
	match:class = ^(kitty)$
	match:title = ^(info)$

	size = 350 120
	stay_focused = on
	float = true
}

windowrule {
	name = info-btop
	match:class = ^(kitty)$
	match:title = ^(info-btop)$

	size = 800 400
	stay_focused = on
	float = true
}
