general { 
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    col.active_border = rgba(8c8c8caa)
    col.inactive_border = rgba(595959aa)

    layout = dwindle

}

dwindle {
    pseudotile = true 
    preserve_split = true
}

master {
    new_status = master
}

animations {
	enabled = true
	animation = windows, 1, 1.1, default, popin 0%
	animation = workspaces, 1, 2, default, slide 0%
}

misc {
	disable_splash_rendering = true
	disable_hyprland_logo = true
}

